name: xerno_music
description: "Xerno Music — editorial player for the Xernover library on Linux and Android."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  just_audio: ">=0.9.42 <0.11.0"
  just_audio_media_kit: ^2.1.0
  media_kit_libs_linux: ^1.1.3
  audio_service: ^0.18.16
  audio_session: ">=0.1.21 <0.3.0"
  supabase_flutter: ^2.8.0
  http: ^1.2.2
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.3
  file_picker: ^8.1.4
  url_launcher: ^6.3.1
  dbus: ^0.7.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/library.json
    - assets/icons/xerno.png
    - assets/icons/xerno-256.png
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader-Regular.ttf
          weight: 400
        - asset: assets/fonts/Newsreader-Medium.ttf
          weight: 500
        - asset: assets/fonts/Newsreader-SemiBold.ttf
          weight: 600
