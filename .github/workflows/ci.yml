name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --no-analytics
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  linux:
    name: Linux release bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev mpv libsecret-1-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --no-analytics --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Pack the bundle
        run: |
          mkdir -p dist
          tar -C build/linux/x64/release/bundle -czf dist/XernoMusic-linux-x86_64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: dist/XernoMusic-linux-x86_64.tar.gz
          if-no-files-found: error

  android:
    name: Android release APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --no-analytics
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-*-release.apk dist/
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk dist/XernoMusic-android-universal.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: dist/*.apk
          if-no-files-found: error
